dialect: sqlite
time_key: etime
time_key_rule: Always filter time ranges on etime (the Time Key); it is indexed and, in Ocient, the partition key.
tables:
  flows:
    description: >-
      One row per Flow Record (NetFlow/IPFIX summary of traffic between two endpoints).
      flows is IPv4-only: sip and dip are never IPv6 (dns_metadata can hold IPv6).
    columns:
      sip: {type: TEXT, description: Source IPv4 address, dotted decimal, example: "192.0.2.10"}
      dip: {type: TEXT, description: Destination IPv4 address, dotted decimal, example: "198.51.100.20"}
      sport: {type: INTEGER, description: Source port, example: 51000}
      dport: {type: INTEGER, description: Destination port, example: 443}
      proto:
        type: INTEGER
        description: IANA protocol number
        example: 6
        enum: {6: TCP, 17: UDP, 1: ICMP, 132: SCTP}
      tcp_flags:
        type: INTEGER
        description: TCP flags bitmask OR'd over the flow; test a flag with e.g. `tcp_flags & 2 != 0` (SYN)
        example: 18
        enum_bits: {1: FIN, 2: SYN, 4: RST, 8: PSH, 16: ACK, 32: URG}
      circuit: {type: TEXT, description: Opaque 12-character Circuit identifier, example: "AB12CD34EF56"}
      stime: {type: INTEGER, unit: epoch ms UTC, description: Flow start time, example: 1767225600000}
      etime: {type: INTEGER, unit: epoch ms UTC, description: Flow end time (the Time Key), example: 1767225601000}
      bytes: {type: INTEGER, unit: bytes, description: Total bytes in the flow, example: 1500}
      pkts: {type: INTEGER, unit: packets, description: Total packets in the flow, example: 3}
  dns_metadata:
    description: >-
      One row per DNS Response Record: one resource record of a DNS response, repeating that
      response's header and question on every row. Responses only (no queries). A response with
      no records (e.g. NXDOMAIN) has no rows. Rows are records, not responses, so a response with
      several records has several rows (the rows of one response share sip, dip, sport, dport,
      tid and etime). The table is very large: always bound etime tightly.
    columns:
      sip: {type: TEXT, description: "Source IP of the response (the DNS server), IPv4 or IPv6 text", example: "203.0.113.5"}
      dip: {type: TEXT, description: "Destination IP of the response (the client), IPv4 or IPv6 text", example: "10.1.2.3"}
      proto:
        type: INTEGER
        description: IANA protocol number of the transport
        example: 17
        enum: {6: TCP, 17: UDP, 1: ICMP, 132: SCTP}
      sport: {type: INTEGER, description: Source port (usually 53), example: 53}
      dport: {type: INTEGER, description: Destination port, example: 51000}
      tid: {type: INTEGER, description: DNS transaction ID, shared by the rows of one response, example: 4711}
      qr: {type: TEXT, description: "Query/response flag; always 'R' (responses only)", example: "R"}
      opcode:
        type: INTEGER
        description: DNS opcode
        example: 0
        enum: {0: QUERY, 2: STATUS, 4: NOTIFY, 5: UPDATE}
      rcode:
        type: INTEGER
        description: DNS response code
        example: 0
        enum: {0: NOERROR, 1: FORMERR, 2: SERVFAIL, 3: NXDOMAIN, 4: NOTIMP, 5: REFUSED}
      flags: {type: INTEGER, description: DNS header flag bits of the response (meaning not yet confirmed; do not decode), example: 3}
      question:
        type: TEXT
        description: >-
          The question name. Case is preserved and resolvers randomise it, so compare and group on
          LOWER(question). No trailing dot. Bytes outside printable ASCII appear as \HH; IDNs are
          punycode (xn--).
        example: "www.example.com"
      qtype:
        type: INTEGER
        description: Question type
        example: 1
        enum: {1: A, 2: NS, 5: CNAME, 6: SOA, 12: PTR, 15: MX, 16: TXT, 28: AAAA, 33: SRV, 41: OPT, 43: DS, 46: RRSIG, 47: NSEC, 48: DNSKEY, 64: SVCB, 65: HTTPS, 255: ANY, 257: CAA}
      qclass:
        type: INTEGER
        description: Question class
        example: 1
        enum: {1: IN, 3: CH, 255: ANY}
      rsection: {type: TEXT, description: "Section of the record within the response (answer, authority or additional; codes not yet confirmed, do not decode)", example: "N"}
      rname:
        type: TEXT
        description: Owner name of the record. Same case, trailing dot and escaping rules as question; compare on LOWER(rname).
        example: "www.example.com"
      rtype:
        type: INTEGER
        description: Record type
        example: 1
        enum: {1: A, 2: NS, 5: CNAME, 6: SOA, 12: PTR, 15: MX, 16: TXT, 28: AAAA, 33: SRV, 41: OPT, 43: DS, 46: RRSIG, 47: NSEC, 48: DNSKEY, 64: SVCB, 65: HTTPS, 255: ANY, 257: CAA}
      rclass:
        type: INTEGER
        description: Record class
        example: 1
        enum: {1: IN, 3: CH, 255: ANY}
      rttl: {type: INTEGER, unit: seconds, description: Record time to live, example: 300}
      rdata:
        type: TEXT
        description: >-
          Record data as text. A: dotted IPv4. AAAA: compressed lower-case IPv6. NS, CNAME and PTR:
          the name. MX and SRV: the target name only. SOA: the primary nameserver only. TXT: the
          first string only. Several values are separated by ^, escaped as \5E inside a value.
        example: "192.0.2.1"
      etime: {type: INTEGER, unit: epoch ms UTC, description: Response capture time (the Time Key), example: 1767225601000}
  diameter:
    description: >-
      One row per Diameter Transaction Record: a request seen at the home network's DRA/DEA, with its
      answer if one came. A timeout has null answer columns. A retransmitted request is its own row,
      sharing end_to_end_id. Columns that don't apply to a record's interface or command are null.
      Always bound etime.
    columns:
      stime: {type: INTEGER, unit: epoch ms UTC, description: Request time, example: 1767225600000}
      etime: {type: INTEGER, unit: epoch ms UTC, description: "Answer time, or for a timeout the time it was declared, 5 s after stime (the Time Key)", example: 1767225601000}
      latency_ms: {type: REAL, unit: ms, description: Answer delay; null for a timeout, example: 12.5}
      status: {type: TEXT, description: "'Answered', 'Timeout' (no answer arrived) or 'Retransmission' (a request sent again after a timeout)", example: "Answered"}
      session_id: {type: TEXT, description: "Diameter Session-Id: <origin host>;<high 32 bits>;<low 32 bits>", example: "host.example.org;12;34"}
      hop_by_hop_id: {type: INTEGER, description: Hop-by-Hop Identifier (32-bit unsigned), example: 305419896}
      end_to_end_id: {type: INTEGER, description: "End-to-End Identifier (32-bit unsigned), shared by a request and its retransmissions", example: 2596069104}
      application_id:
        type: INTEGER
        description: The Diameter interface
        example: 16777251
        enum: {16777251: S6a, 16777238: Gx, 4: Gy}
      command_code:
        type: INTEGER
        description: The command; the request and its answer share it
        example: 316
        enum: {316: ULR, 317: CLR, 318: AIR, 319: IDR, 320: DSR, 321: PUR, 323: NOR, 272: CCR}
      origin_host: {type: TEXT, description: Host name of the requester, example: "mme.example.org"}
      origin_realm: {type: TEXT, description: Realm of the requester, example: "epc.mnc001.mcc001.3gppnetwork.org"}
      destination_host: {type: TEXT, description: "The request's Destination-Host if it sent one, else the answering host; null for a timeout that sent none", example: "hss.example.org"}
      destination_realm: {type: TEXT, description: Realm the request was sent to, example: "epc.mnc001.mcc001.3gppnetwork.org"}
      sip: {type: TEXT, description: "IPv4 address of the requester", example: "192.0.2.10"}
      dip: {type: TEXT, description: "IPv4 address of the responder", example: "198.51.100.20"}
      sport: {type: INTEGER, description: Requester's transport port, example: 51000}
      dport: {type: INTEGER, description: Responder's transport port, example: 3868}
      proto:
        type: INTEGER
        description: IANA protocol number of the transport
        example: 132
        enum: {6: TCP, 17: UDP, 1: ICMP, 132: SCTP}
      result_code:
        type: INTEGER
        description: >-
          The answer's Result-Code (base Diameter); null when the answer carries an
          Experimental-Result instead, or for a timeout. A request failed if neither result_code nor
          experimental_result_code is 2001. 5001 here is DIAMETER_AVP_UNSUPPORTED, unlike 5001 in
          experimental_result_code.
        example: 2001
        enum: {2001: DIAMETER_SUCCESS, 3002: DIAMETER_UNABLE_TO_DELIVER, 3004: DIAMETER_TOO_BUSY, 4010: DIAMETER_END_USER_SERVICE_DENIED, 4012: DIAMETER_CREDIT_LIMIT_REACHED, 5001: DIAMETER_AVP_UNSUPPORTED, 5012: DIAMETER_UNABLE_TO_COMPLY, 5030: DIAMETER_USER_UNKNOWN}
      experimental_result_code:
        type: INTEGER
        description: >-
          The answer's Experimental-Result-Code (3GPP); null otherwise. 5001 here is
          DIAMETER_ERROR_USER_UNKNOWN, unlike 5001 in result_code.
        example: 5001
        enum: {4181: DIAMETER_AUTHENTICATION_DATA_UNAVAILABLE, 5001: DIAMETER_ERROR_USER_UNKNOWN, 5004: DIAMETER_ERROR_ROAMING_NOT_ALLOWED, 5420: DIAMETER_ERROR_UNKNOWN_EPS_SUBSCRIPTION}
      imsi: {type: TEXT, description: "The Subscriber's IMSI: digits, leading zeros kept", example: "001010000000000"}
      msisdn: {type: TEXT, description: "The Subscriber's phone number, E.164 digits without +. On every Gx and Gy record; on S6a only on a successfully answered ULR and on an IDR", example: "99912345678"}
      imei: {type: TEXT, description: "Device identity, 15 digits; S6a ULR only. For a Subscriber's IMEI, e.g. one found by flows_subscriber_join, match their ULR rows (application_id 16777251, command_code 316) by imsi; a ULR may be well before the time of interest", example: "000000000000000"}
      home_plmn_id: {type: TEXT, description: "The Subscriber's home network, MCC+MNC digits. The home PLMN is '00101', so a Subscriber with any other value is an inbound roamer", example: "00101"}
      visited_plmn_id: {type: TEXT, description: "Network serving the Subscriber, MCC+MNC digits; S6a ULR and AIR. A home Subscriber with another value here is an outbound roamer", example: "00101"}
      ue_ip_address: {type: TEXT, description: "The Subscriber device's IPv4 address; Gx and Gy only. The probe correlates a session, so every record of it has it (on Gy, from PS-Information). An address passes between Subscribers, so match it by session time (see flows_subscriber_join)", example: "192.0.2.33"}
      apn: {type: TEXT, description: "Access Point Name; Gx and Gy only", example: "internet"}
      cc_request_type:
        type: INTEGER
        description: Credit-control request type; Gx and Gy only. A Gx session (one session_id) lasts at most 24 h
        example: 1
        enum: {1: INITIAL_REQUEST, 2: UPDATE_REQUEST, 3: TERMINATION_REQUEST, 4: EVENT_REQUEST}
      cc_request_number: {type: INTEGER, description: "Number of the credit-control request within its session; Gx and Gy only", example: 0}
      rat_type:
        type: INTEGER
        description: Radio access technology; S6a ULR and Gx CCR-I
        example: 1004
        enum: {1000: UTRAN, 1001: GERAN, 1004: EUTRAN, 1005: EUTRAN-NB-IoT, 1006: NR, 1007: LTE-M}
      cancellation_type:
        type: INTEGER
        description: Why a registration was cancelled; S6a CLR only
        example: 0
        enum: {0: MME_UPDATE_PROCEDURE, 1: SGSN_UPDATE_PROCEDURE, 2: SUBSCRIPTION_WITHDRAWAL, 3: UPDATE_PROCEDURE_IWF, 4: INITIAL_ATTACH_PROCEDURE}
functions:
  now:
    signature: now()
    description: >-
      The current time in epoch ms UTC, the same unit as stime and etime. Use it for every relative
      time range ("last 2 hours"): WHERE etime >= now() - 2 * 3600 * 1000. It is a SQLite UDF;
      in Ocient, now() returns a timestamp and needs converting to epoch ms.
    example: "etime >= now() - 3600 * 1000"
  in_cidr:
    signature: in_cidr(ip, cidr)
    description: >-
      1 if the IPv4 or IPv6 address is inside the CIDR block, else 0. Use for network-range
      filters such as WHERE in_cidr(sip, '10.1.0.0/16') or in_cidr(addr, '2001:db8::/32').
      Mixed families give 0, except an IPv4-mapped IPv6 address (::ffff:a.b.c.d) matches an IPv4
      block. Invalid or NULL input gives NULL. It is a SQLite UDF; it needs an Ocient mapping:
      SUBNET(IP(x), len[+96 for IPv4]) = IP('net') (still to be checked on a real Ocient system).
    example: "in_cidr(sip, '192.0.2.0/24')"
  ENDSWITH:
    signature: ENDSWITH(s, suffix)
    description: >-
      1 if text s ends with suffix, else 0. Use for domain suffixes, e.g.
      WHERE ENDSWITH(LOWER(question), '.example.com'). Any NULL argument gives NULL.
    example: "ENDSWITH(LOWER(question), '.example.com')"
  STARTSWITH:
    signature: STARTSWITH(s, prefix)
    description: >-
      1 if text s starts with prefix, else 0. Any NULL argument gives NULL.
    example: "STARTSWITH(LOWER(question), 'www.')"
  SPLIT_PART:
    signature: SPLIT_PART(s, delim, n)
    description: >-
      The n-th piece of s split on delim; n is 1-based and positive. Gives '' when n is
      beyond the last piece. Use for domain labels. Any NULL argument gives NULL.
    example: "SPLIT_PART(LOWER(question), '.', 1)"
  REGEXP_SUBSTR:
    signature: REGEXP_SUBSTR(s, pattern)
    description: >-
      The first substring of s matching the regular expression, or NULL when nothing
      matches. Any NULL argument gives NULL.
    example: "REGEXP_SUBSTR(question, '[a-z0-9]+[.]example[.]org$')"
  REGEXP_COUNT:
    signature: REGEXP_COUNT(s, pattern)
    description: >-
      The number of non-overlapping matches of the regular expression in s (0 for none).
      Any NULL argument gives NULL.
    example: "REGEXP_COUNT(question, '[.]')"
  REVERSE:
    signature: REVERSE(s)
    description: >-
      The text s reversed. Useful for grouping by domain suffix. NULL gives NULL.
    example: "REVERSE(LOWER(question))"
metrics:
  bits_per_second:
    description: Throughput in bits/sec over a window; bytes are totals per flow.
    sql: SUM(bytes) * 8.0 / <window_seconds>
  packets_per_second:
    description: Packet rate over a window.
    sql: SUM(pkts) / <window_seconds>
  top_talkers:
    description: Top talkers - sources (or destinations) ranked by total bytes.
    sql: SELECT sip, SUM(bytes) AS total_bytes FROM flows WHERE etime >= <start> AND etime < <end> GROUP BY sip ORDER BY total_bytes DESC LIMIT 10
  top_names:
    description: The DNS names queried most, grouped case-insensitively.
    sql: SELECT LOWER(question) AS name, COUNT(*) AS n FROM dns_metadata WHERE etime >= <start> AND etime < <end> GROUP BY LOWER(question) ORDER BY n DESC LIMIT 10
  per_minute_series:
    description: Time series bucketed per minute on the Time Key.
    sql: SELECT (etime / 60000) * 60000 AS minute, SUM(bytes) AS bytes FROM flows WHERE etime >= <start> AND etime < <end> GROUP BY minute ORDER BY minute
  failure_rate:
    description: >-
      Share of Diameter Transaction Records per command that failed: neither result_code nor
      experimental_result_code is 2001, so timeouts count as failures.
    sql: >-
      SELECT command_code, AVG(CASE WHEN result_code = 2001 OR experimental_result_code = 2001
      THEN 0.0 ELSE 1.0 END) AS failure_rate FROM diameter
      WHERE etime >= <start> AND etime < <end> GROUP BY command_code
  timeouts_per_minute:
    description: Diameter requests that got no answer, bucketed per minute on the Time Key.
    sql: >-
      SELECT (etime / 60000) * 60000 AS minute, COUNT(*) AS timeouts FROM diameter
      WHERE etime >= <start> AND etime < <end> AND status = 'Timeout' GROUP BY minute ORDER BY minute
  flows_dns_join:
    description: >-
      Join Flow Records to DNS Response Records (each DNS response that belongs to a flow). Equal
      sip, dip, sport, dport and proto, each side's etime bounded separately, and the response's
      etime within the flow's stime..etime. Use it to find the name behind a flow, e.g. the name
      reflectors were abusing in an amplification attack. IPv6 DNS rows never join.
    sql: >-
      SELECT d.question, d.qtype, COUNT(*) AS responses, SUM(f.bytes) AS total_bytes
      FROM flows f JOIN dns_metadata d ON d.sip = f.sip AND d.dip = f.dip AND d.sport = f.sport
      AND d.dport = f.dport AND d.proto = f.proto
      WHERE f.etime >= <start> AND f.etime < <end> AND d.etime >= <start> AND d.etime < <end>
      AND d.etime BETWEEN f.stime AND f.etime
      GROUP BY d.question, d.qtype ORDER BY total_bytes DESC LIMIT 10
  flows_subscriber_join:
    description: >-
      Which Subscriber held a flow's client IP when the flow ended: one row per flow and matching Gx
      session, so wrap it to filter or group (e.g. by imsi). A session spans its INITIAL's stime to its
      TERMINATION's etime, or to its latest record if no TERMINATION is inside the bound. Sessions cap
      at 24 h, so the diameter etime bound is the flows bound widened by 86400000 ms on each side.
      Keep the two equality joins in a UNION ALL; do not join on an OR.
    sql: >-
      WITH s AS (SELECT session_id, MIN(ue_ip_address) AS ue_ip_address, MIN(imsi) AS imsi,
      MIN(msisdn) AS msisdn, MIN(CASE WHEN cc_request_type = 1 THEN stime END) AS session_start,
      COALESCE(MAX(CASE WHEN cc_request_type = 3 THEN etime END), MAX(etime)) AS session_end
      FROM diameter WHERE application_id = 16777238
      AND etime >= <start> - 86400000 AND etime < <end> + 86400000 GROUP BY session_id)
      SELECT s.imsi, s.msisdn, f.sip, f.dip, f.bytes, f.etime FROM flows f
      JOIN s ON f.sip = s.ue_ip_address WHERE f.etime >= <start> AND f.etime < <end>
      AND f.etime BETWEEN s.session_start AND s.session_end
      UNION ALL
      SELECT s.imsi, s.msisdn, f.sip, f.dip, f.bytes, f.etime FROM flows f
      JOIN s ON f.dip = s.ue_ip_address WHERE f.etime >= <start> AND f.etime < <end>
      AND f.etime BETWEEN s.session_start AND s.session_end
