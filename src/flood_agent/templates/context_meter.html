{# Context Usage in an AI Cell's footer: "187k tokens of 1M" and a bar, that cell's last LLM call against the window of the model it ran with. #}
<span class="ctx {{ context.level }}" title="{% if not context.window %}No model is called{% else %}Context used by this cell's last LLM call (includes cached tokens), of the window of the model it ran with{% endif %}">{{ context.text }}{% if context.window %} <span class="meter"><i style="width: {{ context.percent }}%"></i></span>{% endif %}</span>
