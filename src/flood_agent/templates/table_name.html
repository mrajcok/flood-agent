<div class="table-name" x-data="tableName()" data-settings-url="{{ settings_url }}" x-show="name && !gone" x-cloak>
  <span class="name" x-show="!editing" x-text="name"></span>
  <span class="icons" x-show="!editing && !confirming">
    <button type="button" class="edit" @click="edit()" :aria-label="'Edit ' + name" title="Rename this table (its SQL name) or change how long it is kept">&#x270E;&#xFE0E;</button>
    <button type="button" class="copy" @click="insertIntoPrompt(name)" :aria-label="'Copy ' + name" :title="'Copy ' + name + ' into a prompt'">&#x29C9;</button>
    {% if in_chart %}<button type="button" class="view" @click="$dispatch('view-table', name)" :aria-label="'View ' + name" :title="'Show ' + name + ' in a dialog'">&#x25A6;&#xFE0E;</button>{% endif %}
    <button type="button" class="delete" @click="confirming = true" :aria-label="'Delete ' + name" :title="'Delete ' + name">&#x1F5D1;&#xFE0E;</button>
    <button type="button" class="refresh" x-show="refreshable" @click="refresh()" :disabled="refreshing" :aria-busy="refreshing" aria-label="Refresh" :title="refreshing ? 'Refreshing...' : 'Run this table\'s query again and replace its rows'" :class="{ busy: refreshing }">&#x21BB;&#xFE0E;</button>
  </span>
  <span class="confirm" x-show="confirming && !editing" x-cloak>Delete <code x-text="name"></code>?
    <button type="button" class="danger" @click="remove()">Delete</button>
    <button type="button" @click="confirming = false">Cancel</button>
  </span>
  <span class="expires" x-show="!editing && expiresIn" :title="'Retention: ' + retention" x-text="expiresIn"></span>
  <span class="as-of" x-show="!editing && asOf" x-text="asOf"></span>
  <span class="refresh-error err" role="alert" x-show="refreshError" x-text="refreshError"></span>
  <form class="editor" x-show="editing" @submit.prevent="save()" @keydown.escape="editing = false">
    <input type="text" x-ref="nameInput" x-model="draft" @input="renamed()" maxlength="60" required aria-label="Table name (SQL)">
    <label>Keep for
      <select x-model="choice" @change="retentionTouched = true" aria-label="Retention">
        <template x-for="days in presets" :key="days"><option :value="days" :selected="days === choice" x-text="presetLabel(days)"></option></template>
        <option value="custom">Custom</option>
      </select>
    </label>
    <span x-show="choice === 'custom'" x-cloak><input type="number" x-model="custom" min="0.01" :max="policy.max_days" step="any" aria-label="Retention in days"> days</span>
    <button type="submit" class="primary">Save</button>
    <button type="button" @click="editing = false">Cancel</button>
    <span class="err" x-show="saveError" x-text="saveError"></span>
  </form>
</div>
