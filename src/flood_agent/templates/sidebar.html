<aside id="sidebar" {% if oob %}hx-swap-oob="true"{% endif %}>
  <div class="show-tables" x-data="{ open: false, tables: null, error: '', hideRt: false, hideLookup: false, request: 0, confirming: null,
       viewing: null, viewerRequest: 0, viewerLoaded: false, viewerError: '', escapeInEditor: false,
       /* hideRt hides the Result Tables; the name is kept so saved choices survive. */
       init() { this.remember('hideRt'); this.remember('hideLookup'); },
       remember(key) {
         /* Keep a checkbox in localStorage; without storage it just starts unchecked. */
         const item = 'showTables.' + key;
         try { this[key] = localStorage.getItem(item) === '1'; } catch (e) {}
         this.$watch(key, v => { try { localStorage.setItem(item, v ? '1' : '0'); } catch (e) {} });
       },
       async load(quietly = false) {
         /* quietly: keep showing the list (and its scroll position) until the new one arrives. */
         const request = ++this.request;  /* only the latest open's response is shown */
         if (!quietly) this.tables = null;
         this.error = ''; this.confirming = null;
         try {
           const r = await fetch('/api/tables');
           if (!r.ok) throw new Error(r.status);
           const tables = await r.json();
           if (request === this.request) this.tables = tables;
         } catch (e) { if (request === this.request) this.error = 'Could not load the tables. Try again.'; }
       },
       get sections() {
         if (!this.tables) return [];
         return [
           { title: 'Telemetry', names: this.tables.telemetry },
           { title: 'Lookup Tables', names: this.hideLookup ? [] : this.tables.lookup, deletable: true, editable: true },
           { title: 'Saved Tables', names: this.tables.saved, deletable: true, viewable: true },
           { title: 'Result Tables', names: this.hideRt ? [] : this.tables.result, deletable: true, viewable: true },
         ].filter(section => section.names.length);
       },
       retention(name) {
         /* Only Saved and Result Tables have a Retention; '' for the rest. */
         const days = this.tables.retention_days[name];
         if (days === undefined) return '';
         /* Under a day reads better in hours, under an hour in minutes. */
         const [n, unit] = days >= 1 ? [Math.round(days * 100) / 100, 'day']
           : days * 24 >= 1 ? [Math.round(days * 240) / 10, 'hour'] : [Math.max(1, Math.round(days * 1440)), 'minute'];
         return n + ' ' + unit + (n === 1 ? '' : 's');
       },
       expiresIn(name) {
         /* Time left, to the nearest hour, or the nearest day from a week on; '' without a Retention. */
         const ms = this.tables.expires_in_ms[name];
         if (ms === undefined) return '';
         const hours = Math.round(ms / 3600000);
         if (hours < 1) return 'expires in under 1h';
         if (hours >= 7 * 24) return 'expires in ' + Math.round(ms / 86400000) + 'd';  /* from ms: rounding twice drifts */
         const d = Math.floor(hours / 24), h = hours % 24;
         return 'expires in ' + [d && d + 'd', h && h + 'h'].filter(Boolean).join(' ');
       },
       async remove(name) {
         /* Telemetry tables are never offered; the server refuses them anyway. */
         this.error = '';
         try {
           const r = await fetch('/api/tables/' + encodeURIComponent(name), { method: 'DELETE' });
           if (!r.ok && r.status !== 404) throw new Error(r.status);
           for (const kind of ['lookup', 'saved', 'result']) this.tables[kind] = this.tables[kind].filter(n => n !== name);
         } catch (e) { this.error = 'Could not delete ' + name + '. Try again.'; }
         this.confirming = null;
       },
       closeIfOutside(e, close = () => { this.open = false; }) {
         /* A click on the backdrop targets the <dialog> itself, but so does one on its padding: compare coordinates. */
         if (e.target !== e.currentTarget) return;
         const r = e.currentTarget.getBoundingClientRect();
         if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) close();
       },
       async view(name) {
         /* The chat's table Display for a Saved or Result Table (paging, sorting, PSV, rename), in a modal over this one. */
         const request = ++this.viewerRequest;  /* only the latest open's response is shown */
         this.viewing = name; this.showInViewer(''); this.viewerError = '';
         try {
           const r = await fetch('/api/tables/' + encodeURIComponent(name) + '/display');
           const html = r.ok ? await r.text() : '';
           if (request !== this.viewerRequest || this.viewing === null) return;
           if (r.status === 410) this.viewerError = name + ' has expired and been deleted.';
           else if (!r.ok) throw new Error(r.status);
           else this.showInViewer(html);
         } catch (e) { if (request === this.viewerRequest) this.viewerError = 'Could not load ' + name + '. Try again.'; }
       },
       closeViewer() {
         /* A rename or Retention change in the viewer shows in the list (not refreshed if the list closed too). */
         if (this.viewing === null) return;
         this.viewing = null; this.viewerRequest++; this.showInViewer('');
         if (this.$refs.dialog.open) this.load(true);
       },
       showInViewer(html) {
         /* Not x-html: it starts the Display inside its own effect, so the Display's state becomes x-html's
            dependency and a rename re-inserts the original HTML (old name). Alpine's observer starts it here. */
         this.$refs.viewerBody.innerHTML = html; this.viewerLoaded = html !== '';
       },
       closeBeforeDisplayCopy(e) {
         /* The Display's copy button inserts into the chat box, which both modals would keep focus from: close them first. */
         if (!e.target.closest('.table-name .copy')) return;
         this.$refs.viewer.close(); this.$refs.dialog.close();
       },
       keepViewerOpen(e) {
         /* Escape in the Display's rename form cancels the edit, as in the chat; it must not also close the viewer. */
         if (this.escapeInEditor) e.preventDefault();
         this.escapeInEditor = false;
       },
       copy(name) {
         this.$refs.dialog.close();  /* first: a modal dialog keeps focus from the chat box */
         insertIntoChat(name);
       } }">
    <button type="button" class="sidebar-action" @click="open = true; load()">Tables</button>
    <dialog x-ref="dialog" aria-labelledby="show-tables-title" x-effect="open ? $el.showModal() : $el.open && $el.close()" @close="open = false" @click="closeIfOutside($event)">
      <h3 id="show-tables-title">Tables you can query</h3>
      <div class="filters">
        <label><input type="checkbox" x-model="hideRt"> Hide Result Tables (<code>rt_&hellip;</code>)</label>
        <label><input type="checkbox" x-model="hideLookup"> Hide Lookup Tables</label>
      </div>
      <div class="table-list">
        <p x-show="!tables && !error">Loading&hellip;</p>
        <p class="error" x-show="error" x-text="error" x-cloak></p>
        <template x-for="section in sections" :key="section.title">
          <section>
            <h4 x-text="section.title"></h4>
            <ul>
              <template x-for="name in section.names" :key="name">
                <li>
                  <template x-if="confirming !== name">
                    <div class="row"><span class="row-actions">
                      <button type="button" class="copy" :aria-label="'Copy ' + name" :title="'Copy ' + name + ' into the chat'" @click="copy(name)">&#x29C9;</button>
                      <button type="button" class="view" :style="section.viewable ? '' : 'visibility: hidden'" :disabled="!section.viewable" :aria-label="'View ' + name" :title="'View the rows of ' + name" @click="view(name)">&#x25A6;&#xFE0E;</button>
                      <!-- Hidden, not removed, where not offered so the names line up across sections. -->
                      <button type="button" class="delete" :style="section.deletable ? '' : 'visibility: hidden'" :disabled="!section.deletable" :aria-label="'Delete ' + name" :title="'Delete ' + name" @click="confirming = name">&#x1F5D1;&#xFE0E;</button>
                      <button type="button" class="edit" :style="section.editable ? '' : 'visibility: hidden'" :disabled="!section.editable" :aria-label="'Edit ' + name" :title="'Edit ' + name" @click="$dispatch('edit-lookup', name)">&#x270E;&#xFE0E;</button>
                      </span><code x-text="name"></code>
                      <template x-if="expiresIn(name)"><span class="expires" :title="'Retention: ' + retention(name)" x-text="expiresIn(name)"></span></template>
                    </div>
                  </template>
                  <template x-if="confirming === name">
                    <div class="row confirm"><span>Delete <code x-text="name"></code>?</span><span class="row-actions">
                      <button type="button" class="danger" @click="remove(name)">Delete</button>
                      <button type="button" @click="confirming = null">Cancel</button>
                    </span></div>
                  </template>
                </li>
              </template>
            </ul>
          </section>
        </template>
        <p x-show="tables && !sections.length" x-cloak>No tables to show.</p>
      </div>
      <div class="actions"><button type="button" @click="open = false">Close</button></div>
    </dialog>
    <dialog x-ref="viewer" class="table-viewer" aria-label="Table rows"
            x-effect="viewing !== null ? $el.open || $el.showModal() : $el.open && $el.close()"
            @close="closeViewer()" @click="closeIfOutside($event, () => $el.close())" @click.capture="closeBeforeDisplayCopy($event)"
            @keydown.escape.capture="escapeInEditor = !!$event.target.closest('.editor')" @cancel="keepViewerOpen($event)">
      <p x-show="!viewerLoaded && !viewerError">Loading&hellip;</p>
      <p class="error" x-show="viewerError" x-text="viewerError" x-cloak></p>
      <div class="viewer-body" x-ref="viewerBody"></div>
      <div class="actions"><button type="button" @click="$refs.viewer.close()">Close</button></div>
    </dialog>
  </div>
  <div class="lookup" x-data="{ open: false, editing: null, name: '', rows: '', sep: 'comma', overwrite: false, busy: false, error: '',
       /* editing: the Lookup Table being edited, or null when adding one. */
       startAdd() { this.editing = null; this.name = ''; this.rows = ''; this.overwrite = false; this.error = ''; this.open = true; },
       async startEdit(name) {
         this.editing = name; this.rows = ''; this.sep = 'comma'; this.error = ''; this.busy = true; this.open = true;
         try {
           const r = await fetch('/api/lookup-tables/' + encodeURIComponent(name) + '?sep=comma');
           const data = await r.json();
           if (r.ok) this.rows = data.text; else this.error = data.detail || 'Could not load the table.';
         } catch (e) { this.error = 'Could not load the table.'; }
         this.busy = false;
       },
       async reshow(sep, previous) {
         /* Re-show the current text, edits included, in the chosen separator; keep the old one if it does not parse. */
         this.busy = true; this.error = '';
         try {
           const r = await fetch('/api/lookup-tables/reformat', { method: 'POST', body: new URLSearchParams({ rows: this.rows, sep }) });
           const data = await r.json();
           if (r.ok) this.rows = data.text; else { this.error = data.detail || 'Could not change the separator.'; this.sep = previous; }
         } catch (e) { this.error = 'Could not change the separator.'; this.sep = previous; }
         this.busy = false;
       },
       async submit() {
         this.busy = true; this.error = '';
         const verb = this.editing ? 'Updated' : 'Added';
         try {
           let r;
           if (this.editing) {
             r = await fetch('/api/lookup-tables/' + encodeURIComponent(this.editing), { method: 'PUT', body: new URLSearchParams({ rows: this.rows }) });
           } else {
             const body = new URLSearchParams({ name: this.name, rows: this.rows });
             if (this.overwrite) body.set('overwrite', 'on');
             r = await fetch('/api/lookup-tables', { method: 'POST', body });
           }
           const data = await r.json();
           if (r.ok) { this.$dispatch('lookup-added', { ...data, verb }); this.open = false; this.name = ''; this.rows = ''; this.overwrite = false; this.editing = null; }
           else this.error = data.detail || 'Could not save the table.';
         } catch (e) { this.error = 'Could not save the table.'; }
         this.busy = false;
       } }" @edit-lookup.window="startEdit($event.detail)">
    <button type="button" class="sidebar-action" @click="startAdd()">Create lookup table</button>
    <dialog x-effect="open ? $el.showModal() : $el.open && $el.close()" @close="open = false">
      <form @submit.prevent="submit()">
        <template x-if="editing"><h3>Edit <code x-text="editing"></code></h3></template>
        <p class="error" x-show="error" x-text="error" x-cloak></p>
        <template x-if="!editing">
          <div class="add-fields">
            <label>Name: <span class="prefix">lookup_</span><input type="text" x-model="name" maxlength="60" required pattern="[A-Za-z0-9_]+" aria-label="Lookup table name"></label>
            <label><input type="checkbox" x-model="overwrite"> overwrite existing table</label>
          </div>
        </template>
        <template x-if="editing">
          <fieldset class="separator" :disabled="busy">
            <legend>Show columns separated by</legend>
            <template x-for="[value, label] in [['comma', 'Comma'], ['pipe', 'Pipe']]" :key="value">
              <label><input type="radio" name="lookup-sep" :value="value" :checked="sep === value"
                            @change="const previous = sep; sep = value; reshow(value, previous)"> <span x-text="label"></span></label>
            </template>
          </fieldset>
        </template>
        <p class="hint">First row must be the column names. Separate columns with a comma or <code>|</code>; rows pasted from a spreadsheet (tab-separated) work too.</p>
        <textarea x-model="rows" rows="10" required aria-label="Rows" :readonly="busy"></textarea>
        <div class="actions"><button type="submit" class="primary" :disabled="busy" x-text="editing ? 'Save' : 'Submit'">Submit</button> <button type="button" @click="open = false">Cancel</button></div>
      </form>
    </dialog>
  </div>
  <a class="new" href="/">New chat</a>
  <ul>
    {% for c in conversations %}
    <li x-data="{ open: false, editing: false }"{% if c.id == current_id %} class="current"{% endif %}>
      <a href="/c/{{ c.id }}" x-show="!editing" @mouseenter="$el.title = $el.scrollWidth <= $el.clientWidth ? '' : $el.textContent">{{ c.title }}</a>
      <form class="rename" method="post" action="/c/{{ c.id }}/rename" x-show="editing" x-cloak>
        <input type="text" name="title" value="{{ c.title }}" maxlength="60" required x-ref="title" aria-label="Conversation name"
               @keydown.escape="editing = false" @blur="editing = false">
      </form>
      <div class="menu" x-show="!editing" @click.outside="open = false">
        <button type="button" class="dots" aria-label="Conversation options" aria-haspopup="menu" :aria-expanded="open" @click="open = !open">&hellip;</button>
        <div class="popup" role="menu" x-show="open" x-cloak>
          <button type="button" role="menuitem" @click="open = false; editing = true; $nextTick(() => { $refs.title.focus(); $refs.title.select(); })">Rename</button>
          <form method="post" action="/c/{{ c.id }}/delete" class="delete-form" data-preview-url="/c/{{ c.id }}/delete-preview" data-title="Delete this conversation?">
            <button type="submit" role="menuitem">Delete</button>
          </form>
        </div>
      </div>
    </li>
    {% endfor %}
  </ul>
</aside>
