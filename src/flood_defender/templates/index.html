<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flood Defender</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/dist/sse.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
    .user { font-weight: 600; margin-top: 1.25rem; }
    .reply { white-space: pre-wrap; }
    table { border-collapse: collapse; margin: .5rem 0; }
    th, td { border: 1px solid #ccc; padding: .25rem .5rem; text-align: left; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input[name=message] { flex: 1; padding: .5rem; }
  </style>
</head>
<body>
  <h1>Flood Defender</h1>
  <div id="chat"></div>
  <form hx-post="/chat" hx-target="#chat" hx-swap="beforeend" hx-on::after-request="this.reset()">
    <input name="message" placeholder="Ask about your flow traffic..." autocomplete="off" required>
    <button type="submit">Ask</button>
  </form>
</body>
</html>
