# Default value of every setting. This file is the single source of truth: the code
# has no fallbacks, and .env.example is generated from it (see flood_agent.config).
# Override any key with a .env file or an environment variable of the same name in
# upper case (QUERY_TIMEOUT_S, ...). The real environment wins over .env.
# openrouter_api_key has no default; it is a secret and belongs in .env.

llm_backend = "openrouter"  # or "fake" (Fake Mode: no LLM, no key)
default_model = "z-ai/glm-5.3"  # an id from the [[models]] list at the end of this file

telemetry_db = "data/telemetry.db"
results_db = "data/results.db"
app_db = "data/app.db"
semantic_layer = "semantic_layer.yaml"

result_ttl_hours = 24
query_timeout_s = 30
chart_row_cap = 10_000
max_failed_attempts = 3
max_llm_steps = 10

host = "127.0.0.1"
port = 8000

# The curated model list, in the order the Model dropdown shows it ("No model" is added last by
# the app). context_window is OpenRouter's `context_length` from a 2026-11-06 snapshot; re-check
# it against https://openrouter.ai/api/v1/models whenever you add or change an entry.
# efforts are the Effort levels the model offers (empty: no Effort control); default_effort is
# the level OpenRouter applies when none is sent.

[[models]]
id = "anthropic/claude-sonnet-5.5"
label = "Claude Sonnet 5.5"
context_window = 1_000_000
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"

[[models]]
id = "anthropic/claude-opus-5.5"
label = "Claude Opus 5.5"
context_window = 1_000_000
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "medium"  # Anthropic's default; OpenRouter's is high

