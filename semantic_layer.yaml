dialect: sqlite
time_key: etime
time_key_rule: Always filter time ranges on etime (the Time Key); it is indexed and, in Ocient, the partition key.
tables:
  flows:
    description: One row per Flow Record (NetFlow/IPFIX summary of traffic between two endpoints).
    columns:
      sip: {type: TEXT, description: Source IPv4 address, dotted decimal, example: "192.0.2.10"}
      dip: {type: TEXT, description: Destination IPv4 address, dotted decimal, example: "198.51.100.20"}
      sport: {type: INTEGER, description: Source port, example: 51000}
      dport: {type: INTEGER, description: Destination port, example: 443}
      proto:
        type: INTEGER
        description: IANA protocol number
        example: 6
        enum: {6: TCP, 17: UDP, 1: ICMP}
      tcp_flags:
        type: INTEGER
        description: TCP flags bitmask OR'd over the flow
        example: 18
        enum_bits: {1: FIN, 2: SYN, 4: RST, 8: PSH, 16: ACK, 32: URG}
      circuit: {type: TEXT, description: Opaque 12-character Circuit identifier, example: "AB12CD34EF56"}
      stime: {type: INTEGER, unit: epoch ms UTC, description: Flow start time, example: 1767225600000}
      etime: {type: INTEGER, unit: epoch ms UTC, description: Flow end time (the Time Key), example: 1767225601000}
      bytes: {type: INTEGER, unit: bytes, description: Total bytes in the flow, example: 1500}
      pkts: {type: INTEGER, unit: packets, description: Total packets in the flow, example: 3}
functions:
  now:
    signature: now()
    description: >-
      The current time in epoch ms UTC, the same unit as stime and etime. Use it for every relative
      time range ("last 2 hours"): WHERE etime >= now() - 2 * 3600 * 1000. It is a SQLite UDF;
      in Ocient, now() returns a timestamp and needs converting to epoch ms.
    example: "etime >= now() - 3600 * 1000"
  in_cidr:
    signature: in_cidr(ip, cidr)
    description: >-
      1 if the IPv4 address is inside the CIDR block, else 0. Use for network-range filters
      such as WHERE in_cidr(sip, '10.1.0.0/16'). It is a SQLite UDF; it needs an Ocient mapping.
    example: "in_cidr(sip, '192.0.2.0/24')"
metrics:
  bits_per_second:
    description: Throughput in bits/sec over a window; bytes are totals per flow.
    sql: SUM(bytes) * 8.0 / <window_seconds>
  packets_per_second:
    description: Packet rate over a window.
    sql: SUM(pkts) / <window_seconds>
  top_talkers:
    description: Top talkers - sources (or destinations) ranked by total bytes.
    sql: SELECT sip, SUM(bytes) AS total_bytes FROM flows WHERE etime >= <start> AND etime < <end> GROUP BY sip ORDER BY total_bytes DESC LIMIT 10
  per_minute_series:
    description: Time series bucketed per minute on the Time Key.
    sql: SELECT (etime / 60000) * 60000 AS minute, SUM(bytes) AS bytes FROM flows WHERE etime >= <start> AND etime < <end> GROUP BY minute ORDER BY minute
