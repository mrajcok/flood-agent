[project]
name = "flood-defender"
version = "0.1.0"
description = "Chat-driven flow telemetry analysis with no data through the LLM"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.2.4",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flood_defender"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
