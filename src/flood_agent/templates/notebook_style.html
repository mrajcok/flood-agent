<style>

                    box-shadow: 0 8px 24px rgba(30,40,80,.18); padding: .7rem; display: grid; gap: .4rem; min-width: 17rem; font-size: .9rem; }

  /* Cell operations: a toolbar straddling the cell's top-right edge, shown while the pointer is over the cell or focus is in it. */
  .cell-tools { position: absolute; top: -1.4rem; right: .6rem; z-index: 3; display: inline-flex; gap: .15rem; opacity: 0; visibility: hidden; transition: opacity var(--fade, .2s), visibility 0s linear var(--fade, .2s); padding: .15rem; background: #eff1f5; border: 1px solid #c8cfdd; border-radius: .4rem; box-shadow: 0 1px 4px #0002; }
  /* Faint until the pointer (or focus) is on the toolbar itself, so it stays out of the way of the cell's own controls. */
  .cellblock:hover .cell-tools, .cellblock:focus-within .cell-tools { opacity: .55; visibility: visible; transition-delay: 0s; }

  /* Insert strip: invisible until the pointer is on the gap below the cell; no line, just the three buttons. */

  .cell-insert:hover button, .cell-insert:focus-within button, .cellblock:focus-within .cell-insert button { opacity: 1; visibility: visible; transition-delay: 0s; }
