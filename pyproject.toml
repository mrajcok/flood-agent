[project]
name = "flood-defender"
version = "0.1.0"
description = "Chat-driven flow telemetry analysis with no data through the LLM"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.2.4",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flood_defender"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "subprocess: runs the MCP server as a real stdio subprocess",
    "network: needs internet access; skipped unless run with --network",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
