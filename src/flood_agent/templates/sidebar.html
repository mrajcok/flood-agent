<aside id="sidebar" {% if oob %}hx-swap-oob="true"{% endif %}>
  <div class="show-tables" x-data="{ open: false, tables: null, error: '', hideRt: false, hideLookup: false, request: 0,
       init() { this.remember('hideRt'); this.remember('hideLookup'); },
       remember(key) {
         /* Keep a checkbox in localStorage; without storage it just starts unchecked. */
         const item = 'showTables.' + key;
         try { this[key] = localStorage.getItem(item) === '1'; } catch (e) {}
         this.$watch(key, v => { try { localStorage.setItem(item, v ? '1' : '0'); } catch (e) {} });
       },
       async load() {
         const request = ++this.request;  /* only the latest open's response is shown */
         this.tables = null; this.error = '';
         try {
           const r = await fetch('/api/tables');
           if (!r.ok) throw new Error(r.status);
           const tables = await r.json();
           if (request === this.request) this.tables = tables;
         } catch (e) { if (request === this.request) this.error = 'Could not load the tables. Try again.'; }
       },
       shown(name) { return !(this.hideRt && name.startsWith('rt_')) && !(this.hideLookup && name.startsWith('lookup_')); },
       get sections() {
         if (!this.tables) return [];
         return [['Telemetry', this.tables.telemetry], ['Lookup Tables', this.tables.lookup.filter(n => this.shown(n))],
                 ['Result Tables', this.tables.result.filter(n => this.shown(n))]]
           .filter(([, names]) => names.length).map(([title, names]) => ({ title, names }));
       },
       insertIntoChat(name) {
         try { navigator.clipboard.writeText(name).catch(() => {}); } catch (e) {}
         const input = document.querySelector('input[name=message]');
         const value = input.value;
         const before = value.slice(0, input.selectionStart), after = value.slice(input.selectionEnd);
         const head = before + (before && !/\s$/.test(before) ? ' ' : '') + name;
         input.value = head + (after && !/^\s/.test(after) ? ' ' : '') + after;
         this.$refs.dialog.close();
         input.focus();
         input.setSelectionRange(head.length, head.length);
         input.dispatchEvent(new Event('input', { bubbles: true }));
       } }">
    <button type="button" class="sidebar-action" @click="open = true; load()">Show tables</button>
    <dialog x-ref="dialog" aria-labelledby="show-tables-title" x-effect="open ? $el.showModal() : $el.open && $el.close()" @close="open = false">
      <h3 id="show-tables-title">Tables you can query</h3>
      <div class="filters">
        <label><input type="checkbox" x-model="hideRt"> Hide <code>rt_</code> tables</label>
        <label><input type="checkbox" x-model="hideLookup"> Hide <code>lookup_</code> tables</label>
      </div>
      <div class="table-list">
        <p x-show="!tables && !error">Loading&hellip;</p>
        <p class="error" x-show="error" x-text="error" x-cloak></p>
        <template x-for="section in sections" :key="section.title">
          <section>
            <h4 x-text="section.title"></h4>
            <ul>
              <template x-for="name in section.names" :key="name">
                <li><code x-text="name"></code><button type="button" class="copy" :aria-label="'Copy ' + name" :title="'Copy ' + name + ' into the chat'" @click="insertIntoChat(name)">&#x29C9;</button></li>
              </template>
            </ul>
          </section>
        </template>
        <p x-show="tables && !sections.length" x-cloak>No tables to show.</p>
      </div>
      <div class="actions"><button type="button" @click="open = false">Close</button></div>
    </dialog>
  </div>
  <div class="lookup" x-data="{ open: false, name: '', rows: '', overwrite: false, busy: false, error: '',
       async submit() {
         this.busy = true; this.error = '';
         const body = new URLSearchParams({ name: this.name, rows: this.rows });
         if (this.overwrite) body.set('overwrite', 'on');
         try {
           const r = await fetch('/api/lookup-tables', { method: 'POST', body });
           const data = await r.json();
           if (r.ok) { this.$dispatch('lookup-added', data); this.open = false; this.name = ''; this.rows = ''; this.overwrite = false; } else this.error = data.detail || 'Could not add the table.';
         } catch (e) { this.error = 'Could not add the table.'; }
         this.busy = false;
       } }">
    <button type="button" class="sidebar-action" @click="open = true; error = ''">Add lookup table</button>
    <dialog x-effect="open ? $el.showModal() : $el.open && $el.close()" @close="open = false">
      <form @submit.prevent="submit()">
        <p class="error" x-show="error" x-text="error" x-cloak></p>
        <label>Name <span class="prefix">lookup_</span><input type="text" x-model="name" maxlength="60" required pattern="[A-Za-z0-9_]+" aria-label="Lookup table name"></label>
        <p class="hint">First row must be the column names. Separate columns with tab, comma or <code>|</code>.</p>
        <textarea x-model="rows" rows="10" required aria-label="Rows"></textarea>
        <label><input type="checkbox" x-model="overwrite"> Overwrite existing table</label>
        <div class="actions"><button type="submit" class="primary" :disabled="busy">Submit</button> <button type="button" @click="open = false">Cancel</button></div>
      </form>
    </dialog>
  </div>
  <a class="new" href="/">New chat</a>
  <ul>
    {% for c in conversations %}
    <li x-data="{ open: false, editing: false }"{% if c.id == current_id %} class="current"{% endif %}>
      <a href="/c/{{ c.id }}" x-show="!editing">{{ c.title }}</a>
      <form class="rename" method="post" action="/c/{{ c.id }}/rename" x-show="editing" x-cloak>
        <input type="text" name="title" value="{{ c.title }}" maxlength="60" required x-ref="title" aria-label="Conversation name"
               @keydown.escape="editing = false" @blur="editing = false">
      </form>
      <div class="menu" x-show="!editing" @click.outside="open = false">
        <button type="button" class="dots" aria-label="Conversation options" aria-haspopup="menu" :aria-expanded="open" @click="open = !open">&hellip;</button>
        <div class="popup" role="menu" x-show="open" x-cloak>
          <button type="button" role="menuitem" @click="open = false; editing = true; $nextTick(() => { $refs.title.focus(); $refs.title.select(); })">Rename</button>
          <form method="post" action="/c/{{ c.id }}/delete" class="delete-form" data-preview-url="/c/{{ c.id }}/delete-preview" data-confirm="Delete this conversation and its results?">
            <button type="submit" role="menuitem">Delete</button>
          </form>
        </div>
      </div>
    </li>
    {% endfor %}
  </ul>
</aside>
